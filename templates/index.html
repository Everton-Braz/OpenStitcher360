<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStitch AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>OpenStitch <span class="highlight">AI</span></h1>
            <p>Next-Gen Optical Flow Stitching for 360° Cameras</p>
        </header>

        <main>
            <div class="upload-container">
                <div class="drop-zone" id="drop-zone-1" onclick="document.getElementById('file-1').click()">
                    <div class="icon">📷</div>
                    <p>Front Lens</p>
                    <span class="status">No file selected</span>
                    <input type="file" id="file-1" accept="image/*" hidden>
                </div>
                <div class="plus-icon">+</div>
                <div class="drop-zone" id="drop-zone-2" onclick="document.getElementById('file-2').click()">
                    <div class="icon">📸</div>
                    <p>Back Lens</p>
                    <span class="status">No file selected</span>
                    <input type="file" id="file-2" accept="image/*" hidden>
                </div>
            </div>

            <div class="button-group">
                <button id="stitch-btn" class="glow-button">
                    <span class="btn-text">Stitch Images</span>
                    <div class="loader hidden"></div>
                </button>
                <button id="test-btn" class="secondary-button" style="margin-left: 1rem;">
                    Use Test Images
                </button>
                <button id="customBtn" class="glow-button"
                    style="margin-left: 1rem; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);">
                    🎛️ Stitch Custom
                </button>
                <button id="auto-btn" class="glow-button"
                    style="margin-left: 1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    🤖 Auto Stitch (AI)
                </button>
                <button id="optimize-btn" class="primary-button" style="margin-left: 1rem;">
                    ⚡ Optimize Masking
                </button>
            </div>

            <!-- Error Display -->
            <div id="error-div" class="error-message hidden"
                style="margin-top: 1rem; padding: 1rem; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 8px; color: #fca5a5;">
            </div>

            <!-- Auto-Calibrated Parameters Display -->
            <div id="auto-params" class="glass-panel hidden" style="margin-top: 1.5rem; padding: 1.5rem;">
                <h3 style="margin-bottom: 1rem; color: #667eea;">✓ AI-Calibrated Parameters</h3>
                <div id="auto-params-content" style="font-size: 0.9rem; line-height: 1.8;"></div>
            </div>


            <!-- Manual Controls Section -->
            <div class="manual-controls">
                <h3>Manual Controls</h3>

                <!-- Global Controls -->
                <div class="control-group">
                    <label>FOV: <input type="number" id="fov" value="192" step="0.1"></label>
                    <label>Threshold: <input type="number" id="threshold" value="60" step="1"></label>
                    <label>Erosion: <input type="number" id="erosion" value="3" step="1"></label>
                    <label class="checkbox-label"
                        style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="color_correction" style="width: auto;">
                        <span>Color Correction</span>
                    </label>
                </div>

                <!-- Front Lens Controls -->
                <div class="control-group">
                    <h4>Front Lens</h4>
                    <label>Yaw: <input type="number" id="yaw_f" value="0" step="0.1"></label>
                    <label>Pitch: <input type="number" id="pitch_f" value="6" step="0.1"></label>
                    <label>Roll: <input type="number" id="roll_f" value="1.1" step="0.1"></label>
                    <label>Shift X: <input type="number" id="shift_x_f" value="0" step="1"></label>
                    <label>Shift Y: <input type="number" id="shift_y_f" value="0" step="1"></label>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <label style="margin: 0;">Mask Radius: <input type="number" id="mask_radius_f" value="0"
                                step="1" title="0 = Disabled"></label>
                        <button id="auto-radius-btn" class="secondary-button"
                            style="padding: 0.2rem 0.5rem; font-size: 0.8rem;"
                            title="Auto-detect lens radius">Auto</button>
                    </div>
                    <label>Mask Softness: <input type="number" id="mask_softness_f" value="10" step="1"
                            title="Edge Blur (px)"></label>
                    <label>Mask Aspect: <input type="number" id="mask_aspect_f" value="1.0" step="0.01"
                            title=">1.0 = Squashed (Oval), <1.0 = Stretched"></label>
                </div>

                <!-- Back Lens Controls -->
                <div class="control-group">
                    <h4>Back Lens</h4>
                    <label>Yaw: <input type="number" id="yaw_b" value="180" step="0.1"></label>
                    <label>Pitch: <input type="number" id="pitch_b" value="6" step="0.1"></label>
                    <label>Roll: <input type="number" id="roll_b" value="0" step="0.1"></label>
                    <label>Shift X: <input type="number" id="shift_x_b" value="0" step="1"></label>
                    <label>Shift Y: <input type="number" id="shift_y_b" value="0" step="1"></label>
                    <label>Mask Radius: <input type="number" id="mask_radius_b" value="0" step="1"
                            title="0 = Disabled"></label>
                    <label>Mask Softness: <input type="number" id="mask_softness_b" value="10" step="1"
                            title="Edge Blur (px)"></label>
                    <label>Mask Aspect: <input type="number" id="mask_aspect_b" value="1.0" step="0.01"
                            title=">1.0 = Squashed (Oval), <1.0 = Stretched"></label>
                </div>
            </div>

            <!-- Result Section -->
            <div id="result-section" class="result-section hidden" style="margin-top: 2rem;">
                <h3 style="margin-bottom: 1rem; color: #22c55e;">🎉 Stitched Result</h3>
                <div class="result-controls" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <button id="zoom-in" class="secondary-button" style="padding: 0.5rem 1rem;">🔍+</button>
                    <button id="zoom-out" class="secondary-button" style="padding: 0.5rem 1rem;">🔍-</button>
                    <button id="zoom-reset" class="secondary-button" style="padding: 0.5rem 1rem;">↩️ Reset</button>
                    <a id="download-btn" class="glow-button" style="padding: 0.5rem 1rem; text-decoration: none;"
                        download>
                        💾 Download
                    </a>
                </div>
                <div class="result-image-container"
                    style="overflow: hidden; border-radius: 12px; background: rgba(0,0,0,0.3);">
                    <img id="result-img" src="" alt="Stitched panorama"
                        style="max-width: 100%; cursor: grab; transition: transform 0.2s;">
                </div>
            </div>

        </main>
    </div>

    <script src="/static/js/script.js"></script>
</body>

</html>
